name = "auckland-7s-coaching"
main = "worker/index.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

# Set up once per environment (not needed again after this):
#   wrangler d1 create auckland_7s_results
#   -> paste the database_id it prints below
#   wrangler d1 execute auckland_7s_results --remote --file=migrations/0001_init.sql
#   wrangler secret put UPLOAD_KEY    (must match UPLOAD_KEY in index.html)
#   wrangler secret put ADMIN_KEY     (organiser-only export key; keep this one truly secret)
# This repo was copied from sevens-coaching-form -- the database_id values below are its
# placeholders again, not that repo's real ones. Do not point this Worker at another site's
# database, and do not reuse another site's Worker name.
[[d1_databases]]
binding = "DB"
database_name = "auckland_7s_results"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

# Cloudflare's per-PR preview builds run "wrangler preview", which refuses to touch the
# production D1 database unless told to -- it requires this separate block naming a
# preview-safe database instead. A preview database (created and migrated the same way, with
# a name like auckland_7s_results_preview) keeps a preview build's test rows out of real
# coaching data.
[[previews.d1_databases]]
binding = "DB"
database_id = "REPLACE_WITH_YOUR_PREVIEW_DATABASE_ID"
